name: Publish to WordPress.org

# Runs when a GitHub release is published (the draft made by release.yml).
# It downloads the zip attached to that release, checks it against
# SHA256SUMS, and deploys exactly those files to the WordPress.org SVN
# (trunk + tags/<version>). Drafts and prereleases are ignored.
#
# workflow_dispatch: re-run for an already published release, e.g. after a
# network failure. dry_run defaults to true (no SVN commit).
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Published release tag (e.g. v1.4.2)"
        required: true
        type: string
      dry_run:
        description: "Dry run: prepare SVN but do not commit"
        required: true
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: wporg-release
  cancel-in-progress: false

jobs:
  publish:
    name: WordPress.org ${{ github.event.release.tag_name || github.event.inputs.tag }}
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.release.draft == false && github.event.release.prerelease == false)
    runs-on: ubuntu-latest
    environment: wporg
    timeout-minutes: 20
    env:
      TAG: ${{ github.event.release.tag_name || github.event.inputs.tag }}
      DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.dry_run || 'false' }}
      SLUG: checkoutguard
    steps:
      - name: Resolve version
        id: meta
        run: |
          set -euo pipefail
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::'$TAG' is not a stable vX.Y.Z tag. Prereleases do not go to WordPress.org."; exit 1; }
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
          echo "Tag $TAG -> version ${TAG#v} (dry run = $DRY_RUN)"

      - name: Checkout the tag
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: refs/tags/${{ env.TAG }}
          fetch-depth: 0
          persist-credentials: false

      - name: Release must be published, stable and on prod
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          read -r draft pre < <(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft,isPrerelease --jq '"\(.isDraft) \(.isPrerelease)"')
          echo "draft=$draft prerelease=$pre"
          [ "$draft" = "false" ] || { echo "::error::Release $TAG is still a draft."; exit 1; }
          [ "$pre" = "false" ]   || { echo "::error::Release $TAG is a prerelease."; exit 1; }
          git merge-base --is-ancestor HEAD origin/prod \
            || { echo "::error::Tag $TAG is not on prod."; exit 1; }

      - name: Download the release zip and verify it
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          set -euo pipefail
          rm -rf dl build && mkdir -p dl build
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" -D dl \
            -p "$SLUG-$VERSION.zip" -p SHA256SUMS
          (cd dl && sha256sum -c SHA256SUMS)
          unzip -q "dl/$SLUG-$VERSION.zip" -d build
          [ -f "build/$SLUG/$SLUG.php" ] || { echo "::error::Zip does not contain $SLUG/$SLUG.php"; exit 1; }
          .github/scripts/check-version.sh "$VERSION" "build/$SLUG"

      - name: SVN tag must be free
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          set -euo pipefail
          code=$(.github/scripts/svn-tag-status.sh "$VERSION")
          echo "tags/${VERSION} -> HTTP ${code}"
          case "$code" in
            404) ;;
            200) echo "::error::SVN tag ${VERSION} already exists on WordPress.org."; exit 1 ;;
            *)   echo "::error::Could not check SVN tag (HTTP ${code})."; exit 1 ;;
          esac

      - name: Deploy the release zip to WordPress.org SVN
        uses: 10up/action-wordpress-plugin-deploy@54bd289b8525fd23a5c365ec369185f2966529c2 # 2.3.0
        with:
          generate-zip: false
          dry-run: ${{ env.DRY_RUN }}
        env:
          SVN_USERNAME: ${{ secrets.SVN_USERNAME }}
          SVN_PASSWORD: ${{ secrets.SVN_PASSWORD }}
          SLUG: ${{ env.SLUG }}
          VERSION: ${{ steps.meta.outputs.version }}
          BUILD_DIR: build/${{ env.SLUG }}

      - name: Check WordPress.org has the new tag
        if: env.DRY_RUN != 'true'
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          set -euo pipefail
          for i in 1 2 3 4 5 6; do
            code=$(.github/scripts/svn-tag-status.sh "$VERSION")
            echo "try $i: tags/${VERSION} -> HTTP ${code}"
            [ "$code" = "200" ] && break
            sleep 10
          done
          [ "$code" = "200" ] || { echo "::error::tags/${VERSION} not visible after the commit."; exit 1; }
          {
            echo "### CheckoutGuard ${VERSION} is on WordPress.org"
            echo "- SVN: https://plugins.svn.wordpress.org/${SLUG}/tags/${VERSION}/"
            echo "- Plugin page: https://wordpress.org/plugins/${SLUG}/ (can take a few minutes to refresh)"
          } >> "$GITHUB_STEP_SUMMARY"
