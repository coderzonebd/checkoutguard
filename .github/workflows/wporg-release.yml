name: Release to WordPress.org

# Manual only. Run it from the prod branch after the release PR is merged.
# The job uses the protected "wporg" environment, so a required reviewer
# must approve every run before the SVN credentials are exposed.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish (must match plugin header, CG_VERSION and Stable tag)"
        required: true
        type: string
      dry_run:
        description: "Dry run: build and diff, but do not commit to SVN"
        required: true
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: wporg-release
  cancel-in-progress: false

jobs:
  release:
    name: Publish ${{ inputs.version }} (dry run = ${{ inputs.dry_run }})
    runs-on: ubuntu-latest
    environment: wporg
    timeout-minutes: 20
    steps:
      - name: Only from prod
        if: github.ref != 'refs/heads/prod'
        run: |
          echo "::error::Run this workflow from the prod branch (got ${GITHUB_REF})."
          exit 1

      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Check version strings
        env:
          WANT: ${{ inputs.version }}
        run: |
          set -euo pipefail
          [[ "$WANT" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::Bad version '$WANT'"; exit 1; }
          header=$(sed -nE 's/^[[:space:]*]*Version:[[:space:]]*([0-9.]+).*/\1/p' checkoutguard.php | head -n1)
          const=$(sed -nE "s/.*define\([[:space:]]*'CG_VERSION'[[:space:]]*,[[:space:]]*'([0-9.]+)'.*/\1/p" checkoutguard.php | head -n1)
          stable=$(sed -nE 's/^Stable tag:[[:space:]]*([0-9.]+).*/\1/p' readme.txt | head -n1)
          echo "header=$header CG_VERSION=$const stable=$stable want=$WANT"
          for v in "$header" "$const" "$stable"; do
            [ "$v" = "$WANT" ] || { echo "::error::Version mismatch"; exit 1; }
          done
          awk -v want="= $WANT =" '/^== /{insec=($0 ~ /^== Changelog ==/)} insec && $0==want {found=1} END{exit !found}' readme.txt \
            || { echo "::error::No changelog entry for $WANT inside '== Changelog ==' in readme.txt"; exit 1; }

      - name: PHP lint
        run: |
          set -euo pipefail
          find . -name '*.php' -not -path './.git/*' -not -path './includes/vendor/*' -print0 | xargs -0 -n1 php -l > /dev/null

      - name: Refuse if the SVN tag already exists
        env:
          WANT: ${{ inputs.version }}
        run: |
          set -euo pipefail
          # 404 = tag is free. 200 = already released. Anything else = unknown, stop.
          code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 30 "https://plugins.svn.wordpress.org/checkoutguard/tags/${WANT}/")
          echo "tags/${WANT} -> HTTP ${code}"
          case "$code" in
            404) ;;
            200) echo "::error::SVN tag ${WANT} already exists. Bump the version."; exit 1 ;;
            *)   echo "::error::Could not check SVN tag (HTTP ${code})."; exit 1 ;;
          esac

      - name: Deploy to WordPress.org SVN
        id: deploy
        uses: 10up/action-wordpress-plugin-deploy@54bd289b8525fd23a5c365ec369185f2966529c2 # 2.3.0
        with:
          generate-zip: true
          dry-run: ${{ inputs.dry_run }}
        env:
          SVN_USERNAME: ${{ secrets.SVN_USERNAME }}
          SVN_PASSWORD: ${{ secrets.SVN_PASSWORD }}
          SLUG: checkoutguard
          VERSION: ${{ inputs.version }}

      - name: Upload zip
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: checkoutguard-${{ inputs.version }}
          path: ${{ steps.deploy.outputs.zip-path }}
          retention-days: 30
          if-no-files-found: error
